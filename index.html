<html lang="pt-BR"><head><meta charset="utf-8">

<title>Prova e Certificado — Instalador Cabista Básico</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#F4F1EE;--fg:#141414;--mut:#5E5853;--card:#fff;--line:#D9D3CD;--ac:#C41E1E;--ok:#1B7F3B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--fg:#F4F1EE;--mut:#B5AEA7;--card:#1E1E1E;--line:#3A3632;--ac:#FF5A52;--ok:#5BD68A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141414;--fg:#F4F1EE;--mut:#B5AEA7;--card:#1E1E1E;--line:#3A3632;--ac:#FF5A52;--ok:#5BD68A;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0 0 12px;line-height:1.15}
h1{font-size:34px}h3{font-size:19px}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 32px}
.m{color:var(--mut);font-size:14px}.err{color:var(--ac);font-weight:600;min-height:1.5em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin:0 0 16px}
.b{display:inline-block;text-decoration:none;background:#C41E1E;color:#fff;border:0;padding:12px 22px;border-radius:8px;font:600 16px Inter,sans-serif;cursor:pointer;margin:4px 8px 4px 0}
.b.g{background:transparent;color:var(--fg);border:1px solid var(--line)}.b:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=password],input[type=number],textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;margin:6px 0}
.opt{display:flex;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer}.opt:hover{background:var(--bg)}.opt input{margin-top:5px}
blockquote{margin:8px 0;padding:8px 14px;border-left:4px solid var(--ac);color:var(--mut);white-space:pre-wrap}
.bar{height:12px;background:#E4DED8;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:#C41E1E}
.row{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px 14px;align-items:center;margin:10px 0}.row em{font-style:normal;font-size:14px}
@media (max-width:600px){.card .row{grid-template-columns:1fr auto}.card .row .bar{grid-column:1/-1}}
.rv{margin:4px 0}.y{color:var(--ok)}.n{color:var(--ac)}
#certwrap{width:1123px;margin:0 auto}
@media print{body{background:#fff}:root{padding:0}.np{display:none!important}#certwrap{zoom:1!important}}
</style></head><body><div id="app"></div>

async function hp(sl,p){const t=sl+'|'+p;try{if(crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}let h=2166136261;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)}return 'f'+(h>>>0).toString(16)}

const sl=Math.random().toString(36).slice(2)+Date.now().toString(36);u[em]={s:sl,h:await hp(sl,pw)};try{localStorage.setItem('rtu',JSON.stringify(u))}catch(e){return msg('O navegador bloqueou o armazenamento. Abra o link em uma aba normal.')}}

try{const o=dec(m[1]);if(!o.n||!Array.isArray(o.r))throw 0;IN.d={n:String(o.n).slice(0,120),m:String(o.m||'').slice(0,120),d:String(o.d||''),au:Math.min(TOT,Math.max(0,+o.a||0)),r:o.r.slice(0,Q.length),e:String(o.e||'')}}catch(e){return msg('Código inválido ou incompleto.')}
IN.nw=null;go(9)}}
else if(S.st==9){const d=IN.d,k=calc({...d,nw:null});
a.innerHTML=head('Correção do aluno')+`<div class="card"><h3>${E(d.n)}</h3><p class="m">${E(d.m||'e-mail não informado')} · ${E(d.d)} · ${d.au} de ${TOT} aulas assistidas · objetivas: ${k.h.reduce((x,y)=>x+y)} de 15 certas (${F(k.ob)} de 7,5)</p>${revH(d)}</div><div class="card"><h3>Resposta escrita</h3><blockquote>${E(d.e)}</blockquote><p>Nota da questão escrita (0 a 2,5):</p><input type="number" id="nv" min="0" max="2.5" step="0.25" value="${IN.nw??''}"><p class="err" id="msg" role="alert"></p></div>${nav('n9','Gerar certificado')}</div>`;
$('#bk').onclick=()=>go(8);$('#n9').onclick=()=>{const v=parseFloat($('#nv').value);if(!(v>=0&&v<=2.5))return msg('Informe um valor entre 0 e 2,5.');IN.nw=v;go(10)}}
else{const d=IN.d,k=calc({...d,nw:IN.nw}),H=cert(d,k);
a.innerHTML=`<div class="wrap np"><h1>Certificado</h1><p>Nota final: <b>${F(k.nota)}</b> de 10. Clique em Baixar certificado, abra o arquivo no navegador e use o botão Imprimir (ou Salvar como PDF). A frente e o verso saem em duas páginas A4 paisagem.</p><p class="err" id="msg" role="alert"></p><button class="b g" id="bk">Voltar</button><button class="b" id="dl">Baixar certificado</button><button class="b g" id="pr">Imprimir aqui</button></div><div id="certwrap">${H}</div>`;
fit();$('#bk').onclick=()=>go(9);
$('#pr').onclick=()=>{try{print()}catch(e){}msg('Se a impressão não abrir, use Baixar certificado.')};
$('#dl').onclick=async()=>{const fn='certificado-'+d.n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'-').toLowerCase().slice(0,40)+'.html',data=certDoc(H,d.n);
const u=URL.createObjectURL(new Blob([data],{type:'text/html'})),l=document.createElement('a');l.href=u;l.download=fn;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);msg('Arquivo baixado. Abra-o no navegador e clique em Imprimir.')}}
if(S.st<8){a.insertAdjacentHTML('beforeend',`<div class="wrap"><p class="m">Conectado como ${E(CUR)}</p><button class="b g" id="out">Sair</button><button class="b g" id="ins">Área do instrutor</button></div>`);$('#out').onclick=()=>{save();CUR='';try{localStorage.removeItem('rtc')}catch(e){}S=blank();render()};$('#ins').onclick=()=>go(8)}}
render();
</script></body></html>
